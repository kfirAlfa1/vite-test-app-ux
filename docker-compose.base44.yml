services:
  web:
    image: node:22
    working_dir: /app
    restart: on-failure
    ports:
      - "3000:8080"
    volumes:
      - ./:/app
      - /app/node_modules
    environment:
      - BASE44_PREVIEW_MODE=1
      - BASE44_SANDBOX_HOST_DOMAIN
      - __VITE_ADDITIONAL_SERVER_ALLOWED_HOSTS
    command: ["sh", "-ec", "npm install && exec npx vite --host 0.0.0.0 --port 8080"]
    healthcheck:
      test: ["CMD", "sh", "-c", "wget -qO- http://localhost:8080/ >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
