services:
  web:
    image: node:22
    working_dir: /app
    restart: on-failure
    ports:
      - "3000:8080"
    environment:
      - BASE44_PREVIEW_MODE=${BASE44_PREVIEW_MODE:-}
      - BASE44_PUBLIC_HOST_SUFFIX=${BASE44_PUBLIC_HOST_SUFFIX:-}
      - __VITE_ADDITIONAL_SERVER_ALLOWED_HOSTS=${__VITE_ADDITIONAL_SERVER_ALLOWED_HOSTS:-}
      - BASE44_SANDBOX_HOST_DOMAIN=${BASE44_SANDBOX_HOST_DOMAIN:-}
    volumes:
      - ./:/app
    command: ["sh", "-ec", "npm install && exec npm run dev -- --host 0.0.0.0"]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:8080/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 5
